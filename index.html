<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PAGE TITLE - CHỈ CINEVERSE -->
    <title>Cineverse</title>
    
    <!-- PRECONNECT & DNS-PREFETCH FOR BLAZING FAST IMAGE & API DELIVERIES (CLOUDFLARE 1.1.1.1 OPTIMIZED) -->
    <link rel="preconnect" href="https://cloudflare-dns.com" />
    <link rel="dns-prefetch" href="https://cloudflare-dns.com" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://phimapi.com" />
    <link rel="dns-prefetch" href="https://phimapi.com" />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/CKKky2tq/favicon-2.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E50914" />
    
    <!-- META DESCRIPTION & REFERRER -->
    <meta name="description" content="Cineverse - Free movie streaming platform with cinematic experience" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- OPEN GRAPH (CHO SOCIAL MEDIA) -->
    <meta property="og:title" content="Cineverse" />
    <meta property="og:description" content="Free movie streaming platform" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://cineverse.netlify.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/utils/ultimate-ad-skipper.js"></script>
  </body>
</html>
